name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint server/ src/ tests/ --max-warnings=0 || true

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build
